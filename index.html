<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
<meta name="theme-color" id="themeColor" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Gymnasieschema" />
<meta name="format-detection" content="telephone=no" />
<title>Gymnasieschema</title>
<style>
  :root{
    --bg:#eef2f6; --panel:#ffffff; --ink:#1c2733; --heading:#1c2733; --muted:#64748b;
    --line:#dbe2ea; --accent:#2563eb; --accent-dark:#1d4ed8;
    --green:#16a34a; --amber:#d97706; --red:#dc2626; --shared:#7c3aed;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 6px 20px rgba(15,23,42,.06);
    --radius:12px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  a{color:var(--accent)}
  button{font-family:inherit}
  input,select,textarea{font-size:16px}/* 16px = ingen auto-zoom på iOS */

  header.app{
    background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;
    padding:calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
    position:sticky;top:0;z-index:40;box-shadow:0 1px 2px rgba(15,23,42,.04);flex-wrap:wrap;
  }
  header.app .brand{display:flex;align-items:center;gap:12px}
  header.app .mark{
    width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),#0ea5e9);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;overflow:hidden;
  }
  header.app .mark img{width:100%;height:100%;object-fit:cover}
  header.app h1{margin:0;font-size:18px;letter-spacing:.2px;color:var(--heading)}
  header.app .sub{margin:0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
  header.app .spacer{flex:1}

  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tabs button{
    border:none;background:transparent;padding:9px 13px;cursor:pointer;
    font-size:13px;font-weight:600;color:var(--muted);border-radius:9px;min-height:40px;
  }
  .tabs button.active{background:var(--accent);color:#fff}
  .tabs button:hover:not(.active){background:#eaf0fb}

  .who{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
  .who select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px;min-height:40px}
  .who .me{display:inline-flex;align-items:center;gap:7px;font-weight:600}
  .who .ava{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
  .conn-dot{width:10px;height:10px;border-radius:50%;background:#94a3b8;display:inline-block}
  .conn-dot.on{background:var(--green)} .conn-dot.err{background:var(--red)}

  main{max-width:1400px;margin:0 auto;padding:16px calc(16px + var(--safe-r)) calc(60px + var(--safe-b)) calc(16px + var(--safe-l))}

  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:42px}
  .btn:hover{background:var(--accent-dark)}
  .btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
  .btn.ghost:hover{background:#eff5ff}
  .btn.subtle{background:#eef2f6;color:var(--ink);border:1px solid var(--line)}
  .btn.subtle:hover{background:#e2e8f0}
  .btn.danger{background:var(--red)} .btn.danger:hover{background:#b91c1c}
  .btn.sm{padding:7px 11px;font-size:13px;min-height:36px}
  .icon-btn{background:transparent;border:none;cursor:pointer;color:var(--muted);padding:7px;border-radius:8px;font-size:16px;min-width:36px;min-height:36px}
  .icon-btn:hover{background:#eef2f6;color:var(--ink)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:200px;flex:1;max-width:420px}
  .search input{border:none;outline:none;font-size:16px;width:100%;background:transparent}
  select.f,input.f{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;min-height:42px}
  label.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:42px}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
  .seg button{border:none;background:#fff;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);min-height:42px}
  .seg button.active{background:var(--accent);color:#fff}

  .navbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
  .navbar .title{font-weight:700;font-size:16px;color:var(--heading)}
  .navbar .range{color:var(--muted);font-size:13px}
  .navbar .grow{flex:1}

  .persons{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .person-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;cursor:pointer;user-select:none;min-height:40px}
  .person-chip.off{opacity:.4}
  .person-chip .ava{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}

  .grid-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Låst schemavy: menyraderna ovanför ligger kvar, endast schemat scrollar (vertikalt+horisontellt) */
  .grid-scroll.sched{overflow:auto}
  .wgrid{display:grid;min-width:640px}
  .wgrid.usercols{min-width:520px}
  .wgrid .corner{background:#f8fafc;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  .wgrid .dayhead{background:#f8fafc;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px 8px;text-align:center;position:sticky;top:0;z-index:3}
  .wgrid .dayhead .dn{font-weight:700;font-size:14px;text-transform:capitalize}
  .wgrid .dayhead .dd{font-size:11px;color:var(--muted)}
  .wgrid .dayhead.today{background:#eff6ff}
  .wgrid .dayhead.today .dn{color:var(--accent)}
  .wgrid .dayhead .uava{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;margin-right:5px;vertical-align:middle}

  .allday-row{border-bottom:1px dashed var(--line)}
  .allday-cell{border-right:1px solid var(--line);padding:5px;min-height:34px;display:flex;flex-direction:column;gap:4px}
  .allday-label{font-size:10px;color:var(--muted);padding:8px 6px;text-align:right;border-right:1px solid var(--line);text-transform:uppercase;letter-spacing:.5px}

  .timecol{position:relative;border-right:1px solid var(--line)}
  .timelabel{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-6px)}
  .daycol{position:relative;border-right:1px solid var(--line)}
  .hourline{position:absolute;left:0;right:0;border-top:1px solid #eef2f6}
  .nowline{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:5}
  .nowline::before{content:"";position:absolute;left:-4px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--red)}

  .event{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 6px;overflow:hidden;cursor:pointer;color:#fff;font-size:12px;border-left:4px solid rgba(0,0,0,.28);box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .event:hover{filter:brightness(1.05);z-index:8}
  .event .et{font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .event .em{opacity:.92;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Uppgifter: annan raster (streckad ram + diagonalt raster), men samma användarfärg */
  .event.task{border-left-style:dashed;border-top:1px dashed rgba(255,255,255,.6);
    background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 5px,rgba(255,255,255,0) 5px 11px)}
  .event.done{opacity:.55;text-decoration:line-through}
  .event.shared{border-left-width:5px;border-left-color:rgba(255,255,255,.75);box-shadow:0 0 0 2px rgba(255,255,255,.4) inset}
  .event .badge{font-size:9px;background:rgba(255,255,255,.28);border-radius:4px;padding:0 4px;margin-left:4px}

  .chip-ad{border-radius:6px;padding:3px 7px;font-size:12px;color:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid rgba(0,0,0,.25)}
  .chip-ad.task{border-left-style:dashed;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 5px,rgba(255,255,255,0) 5px 11px)}
  .chip-ad.done{opacity:.55;text-decoration:line-through}

  /* MONTH */
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .mgrid .mhd{background:#f8fafc;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .mcell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:104px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
  .mcell.other{background:#fafbfc;opacity:.7}
  .mcell.today{background:#eff6ff}
  .mcell .mdn{font-size:12px;font-weight:700;color:var(--muted)}
  .mcell.today .mdn{color:var(--accent)}
  .mcell .more{font-size:10px;color:var(--muted)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 6px;font-size:16px;color:var(--heading)}
  .card.full{grid-column:1/-1}
  .stat{display:flex;gap:12px;flex-wrap:wrap}
  .stat .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);min-width:110px}
  .stat .box .n{font-size:22px;font-weight:800} .stat .box .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  table.list{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  table.list th,table.list td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
  table.list th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  table.list tr:hover td{background:#f8fbff}
  .tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .tag.activity{background:#dbeafe;color:#1e40af} .tag.task{background:#fef3c7;color:#92400e}
  .tag.done{background:#dcfce7;color:#166534} .tag.shared{background:#ede9fe;color:#5b21b6} .tag.manual{background:#e0f2fe;color:#075985}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .muted{color:var(--muted)} .empty{padding:40px;text-align:center;color:var(--muted)}

  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px 14px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(15,23,42,.3);animation:pop .12s ease;margin-bottom:24px}
  .modal.wide{max-width:860px}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
  .modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal .mh h2{margin:0;font-size:17px}
  .modal .mh .spacer{flex:1}
  .modal .mb{padding:18px 20px;max-height:72vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;font-family:inherit}
  .field textarea{min-height:70px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .hstep{display:flex;gap:8px;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
  .hstep:last-child{border-bottom:none}
  .hstep .act{font-weight:700;font-size:11px;padding:2px 8px;border-radius:6px}
  .hstep .act.create,.hstep .act.import{background:#dcfce7;color:#166534}
  .hstep .act.update{background:#dbeafe;color:#1e40af}
  .hstep .act.delete{background:#fee2e2;color:#991b1b}
  .batch{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}
  .batch:last-child{border-bottom:none}
  .batch .kind{font-weight:700;font-size:11px;padding:2px 8px;border-radius:6px;background:#f3e8ff;color:#6b21a8}
  .batch .kind.csv{background:#e0f2fe;color:#075985} .batch .kind.ics{background:#dcfce7;color:#166534}
  .batch .kind.feed{background:#fef3c7;color:#92400e} .batch .kind.image{background:#fce7f3;color:#9d174d}
  .code{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;overflow:auto;white-space:pre;max-height:340px}
  .pill-file{display:inline-flex;align-items:center;gap:8px;background:#eff5ff;border:1px dashed var(--accent);color:var(--accent);border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:600}
  .preview-tbl{width:100%;border-collapse:collapse;font-size:12px}
  .preview-tbl th,.preview-tbl td{border:1px solid var(--line);padding:5px 7px;text-align:left;white-space:nowrap}
  .preview-tbl th{background:#f8fafc}
  .toast{position:fixed;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:200;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .switch{position:relative;display:inline-block;width:44px;height:26px;flex:0 0 auto}
  .switch input{display:none}
  .switch .sl{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s;cursor:pointer}
  .switch .sl::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+.sl{background:var(--green)}
  .switch input:checked+.sl::before{transform:translateX(18px)}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .swatches button{width:34px;height:34px;border-radius:9px;cursor:pointer}
  .ptoggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;background:#fff;min-height:40px}
  .ptoggle.on{border-color:var(--accent);background:#eff5ff;color:var(--accent);font-weight:600}

  /* LOCK / LOGIN */
  #lockOverlay{position:fixed;inset:0;background:linear-gradient(160deg,#0f172a,#1e293b);display:none;align-items:center;justify-content:center;z-index:300;padding:24px;padding-top:calc(24px + var(--safe-t));padding-bottom:calc(24px + var(--safe-b))}
  #lockOverlay.show{display:flex}
  .lockcard{background:#fff;border-radius:20px;max-width:440px;width:100%;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.5);max-height:92vh;overflow:auto}
  .lock-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#0ea5e9);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin:0 auto 12px;overflow:hidden}
  .lock-logo img{width:100%;height:100%;object-fit:cover}
  .lockcard h2{margin:0 0 2px;text-align:center;font-size:22px}
  .lockcard .muted{text-align:center}
  .lock-users{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
  .lock-user{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer;font-size:15px;font-weight:600;min-height:56px}
  .lock-user:hover{border-color:var(--accent);background:#eff5ff}
  .lock-ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex:0 0 auto}
  .pinpad{margin-top:8px}
  .pininput{letter-spacing:8px;text-align:center;font-size:22px}

  @media(max-width:720px){
    .row2,.row3{grid-template-columns:1fr}
    header.app{gap:8px} header.app h1{font-size:16px}
    .cards{grid-template-columns:1fr}
    .lock-users{grid-template-columns:1fr}
    .mcell{min-height:78px}
    main{padding-left:calc(12px + var(--safe-l));padding-right:calc(12px + var(--safe-r))}
    table.list th:nth-child(n+5),table.list td:nth-child(n+5){display:none}
  }
</style>
</head>
<body>
<header class="app">
  <div class="brand">
    <div class="mark" id="brandMark">GS</div>
    <div>
      <h1>Gymnasieschema</h1>
      <p class="sub">Planering per kategori</p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="start" class="active">Start</button>
    <button data-tab="schedule">Schema</button>
    <button data-tab="tasks">Uppgifter</button>
    <button data-tab="list">Lista</button>
    <button data-tab="history">Historik</button>
    <button data-tab="settings">Inställningar</button>
  </nav>
  <div class="spacer"></div>
  <div class="who">
    <button class="icon-btn" id="viewOnlyBtn" title="Visningsläge (endast läsa)">👁</button>
    <span class="conn-dot" id="connDot" title="Lagring"></span>
  </div>
</header>

<main id="main"></main>

<!-- Editor modal -->
<div class="overlay" id="editorOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="mh"><h2 id="editorTitle">Ny post</h2><div class="spacer"></div><button class="icon-btn" onclick="closeEditor()">✕</button></div>
    <div class="mb" id="editorBody"></div>
    <div class="mf">
      <button class="btn danger" id="editorDelete" style="margin-right:auto;display:none" onclick="deleteFromEditor()">Ta bort</button>
      <button class="btn subtle" onclick="closeEditor()">Avbryt</button>
      <button class="btn" id="editorSave" onclick="saveFromEditor()">Spara</button>
    </div>
  </div>
</div>

<!-- Person modal -->
<div class="overlay" id="personOverlay">
  <div class="modal" style="max-width:480px" role="dialog" aria-modal="true">
    <div class="mh"><h2 id="personTitle">Kategori</h2><div class="spacer"></div><button class="icon-btn" onclick="closePerson()">✕</button></div>
    <div class="mb" id="personBody"></div>
    <div class="mf">
      <button class="btn danger" id="personDelete" style="margin-right:auto;display:none" onclick="deletePerson()">Ta bort</button>
      <button class="btn subtle" onclick="closePerson()">Avbryt</button>
      <button class="btn" onclick="savePerson()">Spara</button>
    </div>
  </div>
</div>

<!-- Import modal -->
<div class="overlay" id="importOverlay">
  <div class="modal wide" role="dialog" aria-modal="true">
    <div class="mh"><h2>Importera kalender</h2><div class="spacer"></div><button class="icon-btn" onclick="closeImport()">✕</button></div>
    <div class="mb" id="importBody"></div>
    <div class="mf" id="importFooter"></div>
  </div>
</div>

<!-- Lock / login -->
<div id="lockOverlay">
  <div class="lockcard" id="lockBody"></div>
</div>

<div class="toast" id="toast"></div>

(function(){
"use strict";

const APP_VERSION="2.6.0";

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,props={},kids=[])=>{const n=document.createElement(t);for(const k in props){if(k==='class')n.className=props[k];else if(k==='html')n.innerHTML=props[k];else if(k.startsWith('on'))n.addEventListener(k.slice(2),props[k]);else if(k==='style')n.setAttribute('style',props[k]);else if(props[k]===true)n.setAttribute(k,k);else if(props[k]===false||props[k]==null){}else n.setAttribute(k,props[k]);}for(const c of [].concat(kids)){if(c==null)continue;n.appendChild(typeof c==='string'?document.createTextNode(c):c);}return n;};
const uid = ()=> 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad = n=> String(n).padStart(2,'0');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function initial(name){return (name||'?').trim().charAt(0).toUpperCase();}
function shade(hex,pct){try{hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const num=parseInt(hex,16);let r=(num>>16)+Math.round(255*pct/100),g=((num>>8)&255)+Math.round(255*pct/100),b=(num&255)+Math.round(255*pct/100);r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}catch(e){return hex;}}

const DAYS = ['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
const DAYS_SHORT = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const PALETTE = ['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#0f766e','#4f46e5','#ca8a04'];
const EMOJIS = ['🧑‍🏫','👩‍🏫','👨‍🎓','👩‍🎓','🧑‍💻','👦','👧','🧒','👨','👩','🐱','🐶','🦊','🐼','⭐','🎓','📚','⚽','🎾','🎨','🎹','🏀'];

function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function dstr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return dstr(d);}
function mondayOf(s){const d=parseDate(s);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return dstr(d);}
function firstOfMonth(s){const d=parseDate(s);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-01`;}
function isoWeek(s){const d=parseDate(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const first=new Date(Date.UTC(t.getUTCFullYear(),0,4));const wk=1+Math.round(((t-first)/86400000-3+((first.getUTCDay()+6)%7))/7);return wk;}
function longDate(s){const d=parseDate(s);return `${d.getDate()} ${MONTHS[d.getMonth()]}`;}
function dowIndex(s){return (parseDate(s).getDay()+6)%7;}
function toMin(t){if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+(m||0);}
function fromMin(m){return `${pad(Math.floor(m/60))}:${pad(m%60)}`;}
function addMonths(s,n){const d=parseDate(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,dim));return dstr(d);}
function expandRecurrence(start,mode,until){
  if(!mode||mode==='none')return [start];
  const untilStr=until||start;const out=[];
  if(mode==='weekly'||mode==='biweekly'){
    const step=mode==='weekly'?7:14;let cur=start,g=0;
    while(cur<=untilStr&&g<500){out.push(cur);cur=addDays(cur,step);g++;}
  }else if(mode==='monthly'){
    const s=parseDate(start);const day=s.getDate();let y=s.getFullYear(),m=s.getMonth(),g=0;
    while(g<240){const dim=new Date(y,m+1,0).getDate();
      if(day<=dim){const ds=`${y}-${pad(m+1)}-${pad(day)}`;if(ds>untilStr)break;if(ds>=start)out.push(ds);}
      m++;if(m>11){m=0;y++;}g++;if(`${y}-${pad(m+1)}-01`>untilStr)break;}
  }
  return out.length?out:[start];
}
function recurLabel(mode){return {weekly:'varje vecka',biweekly:'varannan vecka',monthly:'en gång i månaden'}[mode]||'';}

/* ---------- state ---------- */
const LS_KEY='gymnasieschema_v2';

/* ---------- persistence ---------- */
function saveLocal(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({
    persons:state.persons,items:state.items,history:state.history,batches:state.batches,
    subscriptions:state.subscriptions,deletedSubs:state.deletedSubs,deletedItems:state.deletedItems,deletedCats:state.deletedCats,
    settings:state.settings,updatedAt:state.updatedAt
  }));}catch(e){console.warn('save fail',e);}
}

const DEFAULT_CATEGORIES=[['Transport','#0891b2','🚗'],['Läxor','#7c3aed','📚'],['Jobba','#2563eb','💼'],['Träna','#16a34a','🏃'],['Övrigt','#64748b','📌']];
function seed(){
  state.persons=DEFAULT_CATEGORIES.map(([name,color,icon])=>({id:uid(),name,color,icon,visible:true}));
  // VIKTIGT: bumpa INTE updatedAt här. Ett tomt seed får aldrig se "nyare" ut än
  // molnet, annars skulle en rensad enhet skriva över molndatan med tomt schema.
  saveLocal();

// tomt/orört starttillstånd? (används för att aldrig skriva över riktig molndata)
function isSeedEmpty(){
  return (!state.items||!state.items.length) && (!state.subscriptions||!state.subscriptions.length)
    && (!state.batches||!state.batches.length) && (!state.history||!state.history.length);
}
function normalizePersons(){
  (state.persons||[]).forEach(p=>{if(!('icon'in p))p.icon='';if(!('visible'in p))p.visible=true;});
}
function normalizeItems(){
  (state.items||[]).forEach(i=>{if(i.shared)i.shared=false;});
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(LS_KEY);if(raw){const p=JSON.parse(raw);Object.assign(state,p);}}catch(e){console.warn('load fail',e);}
  freshBoot = !raw;

  else{const d=defaultSettings();state.settings=Object.assign({},d,state.settings);state.settings.brand=Object.assign({},d.brand,state.settings.brand||{});}
  if(typeof state.updatedAt!=='number')state.updatedAt=0;
  if(!Array.isArray(state.subscriptions))state.subscriptions=[];
  if(!Array.isArray(state.batches))state.batches=[];

/* ---------- history + batches ---------- */
// itemIds (valfritt): vilka poster raden avser, så att man kan radera dem från Ändringsloggen.
function logHistory(action,item,details,itemIds){
  const entry={id:uid(),ts:new Date().toISOString(),action,itemId:item?item.id:null,
    itemTitle:item?item.title:(details||''),by:'',details:details||''};
  if(Array.isArray(itemIds)&&itemIds.length)entry.itemIds=itemIds.slice();
  else if(item&&item.id)entry.itemIds=[item.id];
  state.history.unshift(entry);
  if(state.history.length>3000)state.history.length=3000;
}
// key: stabil nyckel för uppdateringar som ska ersätta varandra (t.ex. en
// prenumeration -> 'feed:<subId>') så bara SENASTE uppdateringen behålls.
// forId: vilken kategori uppdateringen tillhör (för "per kategori"-vy).
function logBatch(kind,label,count,forId,key){
  if(key){
    const ex=state.batches.find(b=>b.key===key);
    if(ex){ex.ts=Date.now();ex.count=count;ex.label=label;ex.forId=forId||ex.forId||null;ex.kind=kind;
      state.batches=state.batches.filter(b=>b!==ex);state.batches.unshift(ex);return ex.id;}
  }
  const b={id:uid(),ts:Date.now(),kind,label,count,by:'',forId:forId||null,key:key||null};
  state.batches.unshift(b);if(state.batches.length>300)state.batches.length=300;return b.id;
}
// Kurerad lista för Historik: garanterar att varje kategoris SENASTE
// import (CSV/ICS/bild) alltid syns, och fyller sedan på med övriga
// uppdateringar upp till 20. Prenumerationer visas bara som senaste rad
// (en per prenumeration, tack vare key-mekaniken i logBatch).
function curatedBatches(limit){
  limit=limit||20;
  const all=state.batches.slice();
  const importKinds=new Set(['csv','ics','image']);
  const pinned=new Map();
  all.forEach(b=>{if(importKinds.has(b.kind)){const k=(b.forId||'?')+':'+b.kind;if(!pinned.has(k))pinned.set(k,b);}});
  const pinnedSet=new Set(pinned.values());
  const out=[...pinnedSet];
  for(const b of all){if(pinnedSet.has(b))continue;if(out.length>=limit)break;out.push(b);}
  out.sort((a,b)=>b.ts-a.ts);
  return out;
}
function deleteBatch(id){
  const b=state.batches.find(x=>x.id===id);if(!b)return;
  const before=state.items.length;
  tombstoneItems(state.items.filter(i=>i.batchId===id).map(i=>i.id));
  state.items=state.items.filter(i=>i.batchId!==id);
  const removed=before-state.items.length;
  state.batches=state.batches.filter(x=>x.id!==id);
  logHistory('delete',null,`Uppdatering borttagen: ${b.label} (${removed} poster)`);
  save();render();toast(`${removed} poster borttagna`);
}

/* ---------- query / filters ---------- */
function visiblePersonIds(){return new Set(state.persons.filter(p=>p.visible).map(p=>p.id));}
function matchesSearch(i){
  if(!ui.search)return true;const q=ui.search.toLowerCase();
  return [i.title,i.description,i.location,personName(i.personId)].some(v=>(v||'').toLowerCase().includes(q));
}
function passesFilters(i){
  if(ui.filterType!=='all' && i.type!==ui.filterType)return false;
  if(ui.filterManual && i.source && i.source!=='manual')return false;
  return matchesSearch(i);
}
// tillhör posten kategorin pid?
function itemInvolves(i,pid){return i.personId===pid;}
function itemsForDateVisible(date){
  const vis=visiblePersonIds();
  return state.items.filter(i=>i.date===date && passesFilters(i) &&
    (vis.has(i.personId) || !catById(i.personId)));
}
function itemsForPersonDate(date,pid){
  return state.items.filter(i=>i.date===date && passesFilters(i) && i.personId===pid);
}

function renderStart(main){

function gridDims(){const ds=state.settings.dayStart,de=state.settings.dayEnd,hours=de-ds,HOURPX=54;return {dayStart:ds,dayEnd:de,hours,HOURPX,gridH:hours*HOURPX};}
function sortItems(a,b){return (toMin(a.start)??1e9)-(toMin(b.start)??1e9) || (a.title||'').localeCompare(b.title);}
function layoutOverlaps(items){
  const out=[];let groups=[];
  items.forEach(it=>{const s=toMin(it.start),e=toMin(it.end)||s+45;let placed=false;
    for(const g of groups){if(s<g.end){g.items.push({it,s,e});g.end=Math.max(g.end,e);placed=true;break;}}
    if(!placed)groups.push({end:e,items:[{it,s,e}]});});
  groups.forEach(g=>{const colsEnd=[];g.items.forEach(o=>{let ci=colsEnd.findIndex(en=>en<=o.s);if(ci===-1){ci=colsEnd.length;colsEnd.push(o.e);}else colsEnd[ci]=o.e;o.col=ci;});
    const total=colsEnd.length;g.items.forEach(o=>out.push({it:o.it,col:o.col,cols:total}));});
  return out;
}
function eventEl(it,dims,leftPct,widthPct){
  const {dayStart,dayEnd,HOURPX}=dims;
  const s=clamp(toMin(it.start),dayStart*60,dayEnd*60);
  const e=clamp(toMin(it.end)||s+45,s+15,dayEnd*60);
  const top=(s-dayStart*60)/60*HOURPX, hgt=Math.max(18,(e-s)/60*HOURPX-2);
  const cls=`event ${it.type}${it.done?' done':''}${it.shared?' shared':''}`;
  return el('div',{class:cls,style:`top:${top}px;height:${hgt}px;left:calc(${leftPct}% + 3px);width:calc(${widthPct}% - 6px);background:${itemColor(it)}`,onclick:()=>openEditor(it)},[
    el('div',{class:'et'},[it.type==='task'?el('span',{class:'badge'},'uppg'):null, ' '+(it.seriesId?'🔁 ':'')+it.title]),
    el('div',{class:'em'},`${it.start}${it.end?'–'+it.end:''}${it.location?' · '+it.location:''}`)
  ]);
}
function alldayChip(it){return el('div',{class:`chip-ad ${it.type}${it.done?' done':''}`,style:`background:${itemColor(it)}`,title:it.title,onclick:()=>openEditor(it)},
  (it.shared?'👥 ':'')+it.title);}
function dayColumn(dateStr,items,dims,ownerForAdd){
  const {dayStart,dayEnd,HOURPX,hours,gridH}=dims;
  const col=el('div',{class:'daycol',style:`height:${gridH}px`,ondblclick:e=>{const y=e.offsetY;const min=dayStart*60+Math.round((y/HOURPX)*60/15)*15;quickAdd(dateStr,fromMin(clamp(min,dayStart*60,dayEnd*60-15)),ownerForAdd);}});
  for(let h=0;h<=hours;h++)col.appendChild(el('div',{class:'hourline',style:`top:${h*HOURPX}px`}));
  if(dateStr===todayStr()){const now=new Date();const nm=now.getHours()*60+now.getMinutes();if(nm>=dayStart*60&&nm<=dayEnd*60)col.appendChild(el('div',{class:'nowline',style:`top:${(nm-dayStart*60)/60*HOURPX}px`}));}
  const timed=items.filter(it=>it.start).sort((a,b)=>toMin(a.start)-toMin(b.start));
  layoutOverlaps(timed).forEach(({it,col:c,cols})=>{const w=100/cols;col.appendChild(eventEl(it,dims,c*w,w));});
  return col;
}

/* ============================================================ LISTA ============================================================ */
let listSelected=new Set();
function renderList(main){
  main.append(controlsBar());
  listSelected=new Set();   // nollställ markering vid ny rendering (t.ex. ny sökning)
  const bar=el('div',{class:'toolbar'});
  const dayI=el('input',{class:'f',type:'date',value:ui.listDay||''});
  const userSel=el('select',{class:'f'});userSel.appendChild(el('option',{value:'all'},'Alla kategorier'));
  state.persons.forEach(p=>{const o=el('option',{value:p.id},(p.icon?p.icon+' ':'')+p.name);if(ui.listUser===p.id)o.selected=true;userSel.appendChild(o);});
  const from=el('input',{class:'f',type:'date',value:ui.listFrom||ui.monday});
  const to=el('input',{class:'f',type:'date',value:ui.listTo||addDays(ui.monday,182)});
  bar.append(el('span',{class:'muted'},'Dag'),dayI,
    el('button',{class:'btn subtle sm',onclick:()=>{dayI.value='';draw();}},'Rensa dag'),
    el('span',{class:'muted'},'Kategori'),userSel,
    el('span',{class:'muted'},'Från'),from,el('span',{class:'muted'},'Till'),to,
    el('button',{class:'btn subtle sm',onclick:draw},'Uppdatera'));
  main.appendChild(bar);
  main.appendChild(el('p',{class:'hint',style:'margin-top:-6px'},'Tips: sök i fältet ovan (t.ex. ett namn). Markera rader och “Radera markerade”, eller “Radera alla träffar” för att ta bort ALLA poster med samma namn – på alla datum.'));

  // markera-alla + massradering
  const selbar=el('div',{class:'toolbar',style:'align-items:center'});
  const selAll=el('input',{type:'checkbox',title:'Markera alla i resultatet'});
  const selInfo=el('span',{class:'muted',style:'font-size:13px'},'0 markerade');
  const delBtn=el('button',{class:'btn danger sm',disabled:true,onclick:()=>bulkDelete()},'🗑 Radera markerade');
  const delAllBtn=el('button',{class:'btn danger sm',onclick:()=>deleteAllMatching()},'🗑 Radera alla träffar (alla datum)');
  if(ui.viewOnly){selbar.append(el('span',{class:'chk',style:'background:#eff6ff;border-color:var(--accent);color:var(--accent);font-weight:600'},'👁 Visningsläge – radering avstängd'));}
  else{
    const selAllWrap=el('label',{class:'chk'});selAllWrap.append(selAll,'Markera alla i resultatet');
    selbar.append(selAllWrap,selInfo,el('div',{style:'flex:1'}),delAllBtn,delBtn);
  }
  main.appendChild(selbar);
  // alla poster som matchar nuvarande sök/typ/kategori – oavsett datumintervall
  function allMatching(){let r=state.items.filter(i=>passesFilters(i));if(userSel.value!=='all')r=r.filter(i=>itemInvolves(i,userSel.value));return r;}
  function deleteAllMatching(){
    const rows=allMatching();
    if(!rows.length){toast('Inga poster matchar sökningen/filtret');return;}
    const feedN=rows.filter(i=>i.source==='feed').length;
    let msg=`Radera ALLA ${rows.length} poster som matchar nuvarande sökning/filter – på alla datum (även utanför datumintervallet)?\n\nDetta kan inte ångras.`;
    if(feedN)msg+=`\n\nOBS: ${feedN} kommer från en prenumeration och kan komma tillbaka vid nästa synk. Ta bort prenumerationen (Inställningar) för att radera dem permanent.`;
    if(!confirm(msg))return;
    const ids=new Set(rows.map(i=>i.id));
    tombstoneItems([...ids]);
    state.items=state.items.filter(i=>!ids.has(i.id));
    logHistory('delete',null,`${rows.length} poster raderade (alla träffar i Lista)`);
    listSelected.clear();save();draw();toast(`${rows.length} poster raderade`);
  }
  const holder=el('div',{});main.appendChild(holder);

  let shownIds=[];
  function refreshSel(){
    selInfo.textContent=`${listSelected.size} markerade`;
    delBtn.disabled=listSelected.size===0;
    delBtn.textContent=listSelected.size?`🗑 Radera markerade (${listSelected.size})`:'🗑 Radera markerade';
    selAll.checked=shownIds.length>0 && shownIds.every(id=>listSelected.has(id));
    holder.querySelectorAll('input.rowchk').forEach(cb=>{cb.checked=listSelected.has(cb.dataset.id);cb.closest('tr').style.background=cb.checked?'#eff6ff':'';});
  }
  selAll.onchange=()=>{if(selAll.checked)shownIds.forEach(id=>listSelected.add(id));else listSelected.clear();refreshSel();};
  function bulkDelete(){
    if(!listSelected.size)return;
    const n=listSelected.size;
    if(!confirm(`Radera ${n} markerade poster? Detta kan inte ångras.`))return;
    const ids=new Set(listSelected);
    tombstoneItems([...ids]);
    state.items=state.items.filter(i=>!ids.has(i.id));
    logHistory('delete',null,`${n} poster raderade (massradering i Lista)`);
    listSelected.clear();save();draw();toast(`${n} poster raderade`);
  }
  function draw(){
    ui.listDay=dayI.value||'';ui.listUser=userSel.value;ui.listFrom=from.value;ui.listTo=to.value;saveUI();
    holder.innerHTML='';shownIds=[];
    let rows=state.items.filter(i=>passesFilters(i)&&i.date);
    if(userSel.value!=='all')rows=rows.filter(i=>itemInvolves(i,userSel.value));
    if(dayI.value)rows=rows.filter(i=>i.date===dayI.value);
    else{const f=from.value||ui.monday,tt=to.value||addDays(ui.monday,182);rows=rows.filter(i=>i.date>=f&&i.date<=tt);}
    rows.sort((a,b)=>a.date.localeCompare(b.date)||(toMin(a.start)??1e9)-(toMin(b.start)??1e9));
    // rensa markeringar som inte längre visas
    const rowIdSet=new Set(rows.map(i=>i.id));[...listSelected].forEach(id=>{if(!rowIdSet.has(id))listSelected.delete(id);});
    if(!rows.length){holder.appendChild(el('div',{class:'card empty'},'Inga poster matchar.'));refreshSel();return;}
    let curDate=null,tb;
    rows.forEach(i=>{
      shownIds.push(i.id);
      if(i.date!==curDate){curDate=i.date;

function deleteHistoryEntry(id){
  const h=state.history.find(x=>x.id===id);if(!h)return;
  const ids=(Array.isArray(h.itemIds)&&h.itemIds.length)?h.itemIds:(h.itemId?[h.itemId]:[]);
  const existing=ids.filter(iid=>state.items.some(it=>it.id===iid));
  if(existing.length){
    if(!confirm(`Radera ${existing.length} aktivitet${existing.length>1?'er':''} som denna loggrad avser?\n\n”${h.itemTitle||h.details||''}”\n\nDetta tar bort själva aktiviteten/aktiviteterna, inte bara loggraden. Kan inte ångras.`))return;
    const set=new Set(existing);
    tombstoneItems(existing);
    state.items=state.items.filter(it=>!set.has(it.id));
    state.history=state.history.filter(x=>x.id!==id);
    logHistory('delete',null,`${existing.length} aktivitet${existing.length>1?'er':''} raderade via Ändringsloggen`);
    save();renderMainOnly();toast(`${existing.length} aktivitet${existing.length>1?'er':''} raderade`);
  }else{
    if(!confirm('Denna loggrad avser inga befintliga aktiviteter (redan borttagna eller ingen post kopplad). Ta bort själva loggraden?'))return;
    state.history=state.history.filter(x=>x.id!==id);
    save();renderMainOnly();
  }
}
function resetAll(){
  if(!confirm('Radera ALL information (poster, historik, uppdateringar, kategorier) och börja om med ett tomt schema?\n\nDetta raderar även i molnet vid nästa synk och kan inte ångras.'))return;
  if(!confirm('Är du helt säker? Detta går inte att ångra.'))return;
  // tombstona allt så molnet inte återställer det vid nästa synk
  tombstoneItems(state.items.map(i=>i.id));
  tombstoneCats(state.persons.map(p=>p.id));
  (state.subscriptions||[]).forEach(s=>{const k=subKey(s);if(k&&!state.deletedSubs.includes(k))state.deletedSubs.push(k);});
  state.items=[];state.history=[];state.batches=[];state.subscriptions=[];
  seed();logHistory('delete',null,'Allt raderat – nytt schema');save();
  toast('Allt raderat – nytt schema skapat');render();
}

function createItems(data,mode,until){
  const dates=expandRecurrence(data.date,mode,until);const created=[];

  const sid = isSeries ? ('s'+uid()) : null;
  const meta = isSeries ? {seriesId:sid,recurMode:mode,seriesStart:data.date,seriesUntil:until||dates[dates.length-1]} : {};
  dates.forEach(dt=>{const it=Object.assign({id:uid(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),source:data.source||'manual'},data,meta,{date:dt,pendingSync:true});state.items.push(it);created.push(it);});

/* ---------- upprepande serier ---------- */
function seriesItems(sid){return state.items.filter(i=>i.seriesId===sid).sort((a,b)=>(a.date||'').localeCompare(b.date||''));}
function seriesMeta(sid){const arr=seriesItems(sid);if(!arr.length)return null;const f=arr[0];return {mode:f.recurMode,start:f.seriesStart||arr[0].date,until:f.seriesUntil||arr[arr.length-1].date,count:arr.length,title:f.title};}
// applicera gemensamma fält (ej datum) på hela serien – hoppar över enskilt
// ändrade dagar (seriesEx) så de skyddas från serieändringar.
function updateSeriesFields(sid,fields){
  const arr=seriesItems(sid);const now=new Date().toISOString();let n=0;
  arr.forEach(it=>{if(it.seriesEx)return;Object.assign(it,fields);it.updatedAt=now;if(it.source==='manual')it.pendingSync=true;n++;});
  return n;
}
// ändra seriens slutdatum: ta bort tillfällen efter datumet, skapa nya fram till det
function setSeriesUntil(sid,newUntil,template){
  const arr=seriesItems(sid);if(!arr.length)return 0;
  const mode=arr[0].recurMode;const start=arr[0].seriesStart||arr[0].date;const proto=arr[0];
  const now=new Date().toISOString();
  const removeIds=new Set(arr.filter(it=>it.date>newUntil).map(it=>it.id));
  if(removeIds.size)state.items=state.items.filter(it=>!removeIds.has(it.id));
  const have=new Set(seriesItems(sid).map(it=>it.date));
  expandRecurrence(start,mode,newUntil).forEach(dt=>{
    if(have.has(dt))return;
    const it=Object.assign({},proto,template||{},{id:uid(),date:dt,seriesId:sid,recurMode:mode,seriesStart:start,seriesUntil:newUntil,source:proto.source||'manual',createdAt:now,updatedAt:now,pendingSync:true,done:false});
    delete it.batchId;delete it.feedId;
    state.items.push(it);
  });
  seriesItems(sid).forEach(it=>{it.seriesUntil=newUntil;it.updatedAt=now;if(it.source==='manual')it.pendingSync=true;});
  return removeIds.size;
}
function deleteSeries(sid){
  const arr=seriesItems(sid);const n=arr.length;const title=arr.length?arr[0].title:'';
  tombstoneItems(arr.map(i=>i.id));
  state.items=state.items.filter(i=>i.seriesId!==sid);
  logHistory('delete',null,`Serie borttagen: ”${title}” (${n} tillfällen)`);
  save();return n;
}

  const mergedSubs=[...subMap.values()].map(s=>Object.assign({},s));
  mergedSubs.forEach(s=>{if(!s.id)s.id='sub'+uid();});
  state.subscriptions=mergedSubs;state.deletedSubs=[...subTombs].slice(-500);
  const liveSubIds=new Set(mergedSubs.map(s=>s.id));
  const droppedLocalSubIds=new Set((state.subscriptions?localSubs:[]).filter(s=>subTombs.has(subKey(s))).map(s=>s.id));

  // KATEGORIER: union per id minus tombstones. En kategori försvinner aldrig
  // via synk – bara genom att raderas (tombstone).
  const catTombs=new Set([...(state.deletedCats||[]),...((Array.isArray(data.deletedCats)?data.deletedCats:[]))]);
  const pmap=new Map();
  (Array.isArray(data.persons)?data.persons:[]).forEach(p=>{if(p&&p.id&&!catTombs.has(p.id))pmap.set(p.id,p);});
  localPersons.forEach(p=>{if(p&&p.id&&!catTombs.has(p.id)){const ex=pmap.get(p.id);if(!ex||ms(p.updatedAt||0)>=ms(ex.updatedAt||0))pmap.set(p.id,p);}});
  let persons=[...pmap.values()];
  if(!persons.length)persons=(Array.isArray(data.persons)&&data.persons.length)?data.persons.slice():(state.persons||[]);
  state.persons=persons;state.deletedCats=[...catTombs].slice(-2000);

  // POSTER: union per id minus tombstones. Ingen post försvinner tyst via synk;
  // borttagning sker bara explicit (tombstone). Vid konflikt (samma id) vinner
  // nyast updatedAt. Feed-poster för borttagna prenumerationer tas bort.
  const itemTombs=new Set([...(state.deletedItems||[]),...((Array.isArray(data.deletedItems)?data.deletedItems:[]))]);
  const imap=new Map();
  (Array.isArray(data.items)?data.items:[]).forEach(i=>{
    if(!i||!i.id||itemTombs.has(i.id))return;
    if(i.source==='feed'&&droppedLocalSubIds.has(i.feedId))return;
    imap.set(i.id,i);
  });
  localItems.forEach(i=>{
    if(!i||!i.id||itemTombs.has(i.id))return;
    if(i.source==='feed'){ if(!imap.has(i.id)&&liveSubIds.has(i.feedId))imap.set(i.id,i); return; }
    const ex=imap.get(i.id);
    if(!ex){imap.set(i.id,i);}
    else if(ms(i.updatedAt)>=ms(ex.updatedAt))imap.set(i.id,i);
  });
  state.items=[...imap.values()].filter(i=>!itemTombs.has(i.id));
  state.deletedItems=[...itemTombs].slice(-8000);

  state.updatedAt=data.updatedAt||Date.now();
  normalizePersons();normalizeItems();normalizeSubscriptions();
  if(session.userId&&!state.persons.find(p=>p.id===session.userId)){session.userId=null;session.master=false;}
  saveLocal();refreshLockIfOpen();
}
async function cloudGet(){const base=supaRestUrl();const r=await fetch(`${base}/${CLOUD_TABLE}?key=eq.${encodeURIComponent(CLOUD_KEY)}&select=data`,{headers:cloudHeaders()});if(!r.ok){cloudLastError=`GET HTTP ${r.status}`;throw new Error(cloudLastError);}const rows=await r.json();return (Array.isArray(rows)&&rows.length)?rows[0].data:null;}
async function cloudPut(){state.updatedAt=Date.now();const data=cloudData();const base=supaRestUrl();let r;try{r=await fetch(`${base}/${CLOUD_TABLE}?key=eq.${encodeURIComponent(CLOUD_KEY)}`,{method:'PATCH',headers:cloudHeaders({Prefer:'return=representation'}),body:JSON.stringify({data})});}catch(e){cloudLastError='Nätverksfel (PATCH): '+e.message;throw e;}if(!r.ok){cloudLastError=`PATCH HTTP ${r.status} – ${(await r.text().catch(()=>'')).slice(0,140)}`;throw new Error(cloudLastError);}let rows=[];try{rows=await r.json();}catch(e){}if(Array.isArray(rows)&&rows.length){cloudLastError='';clearPendingSync();return;}const r2=await fetch(`${base}/${CLOUD_TABLE}`,{method:'POST',headers:cloudHeaders({Prefer:'return=minimal'}),body:JSON.stringify({key:CLOUD_KEY,data})});if(!r2.ok){cloudLastError=`POST HTTP ${r2.status} – ${(await r2.text().catch(()=>'')).slice(0,140)}`;throw new Error(cloudLastError);}cloudLastError='';clearPendingSync();}
function cloudSchedulePush(){if(!cloudEnabled()||!_booted)return;clearTimeout(_pushTimer);_pushTimer=setTimeout(async()=>{cloudSetStatus('saving');try{await cloudPut();cloudLastSync=Date.now();cloudSetStatus('ok');}catch(e){cloudSetStatus('offline');}},800);}
async function cloudPull(rerender){if(!cloudEnabled())return false;const data=await cloudGet();if(data&&(data.updatedAt||0)>(state.updatedAt||0)){applyCloud(data);if(rerender&&!document.querySelector('.overlay.show'))render();cloudLastSync=Date.now();return true;}return false;}
function cloudHasData(data){return !!(data && ((Array.isArray(data.persons)&&data.persons.length)||(Array.isArray(data.items)&&data.items.length)||(Array.isArray(data.subscriptions)&&data.subscriptions.length)||(Array.isArray(data.batches)&&data.batches.length)));}
async function cloudInit(){
  if(!cloudEnabled()){cloudSetStatus('off');return;}
  cloudSetStatus('connecting');
  try{
    const data=await cloudGet();
    if(cloudHasData(data)){
      // Union-merge (se applyCloud). Efter merge: om den sammanslagna vyn
      // skiljer sig från molnet (lokal-bara poster/kategorier/prenumerationer,
      // eller tombstones som tog bort molndata) – spara upp så molnet stämmer.
      const cItemIds=new Set((data.items||[]).map(i=>i&&i.id));
      const cPersonIds=new Set((data.persons||[]).map(p=>p&&p.id));
      const cSubKeys=new Set((data.subscriptions||[]).map(s=>subKey(s)));
      applyCloud(data);
      if(!document.querySelector('#lockOverlay.show'))render();else refreshLockIfOpen();
      const diff=
        (state.items||[]).length!==cItemIds.size || (state.items||[]).some(i=>!cItemIds.has(i.id)) ||
        (state.persons||[]).length!==cPersonIds.size || (state.persons||[]).some(p=>!cPersonIds.has(p.id)) ||
        (state.subscriptions||[]).length!==cSubKeys.size || (state.subscriptions||[]).some(s=>!cSubKeys.has(subKey(s)));
      if(diff){try{await cloudPut();}catch(e){}}
    }else{
      // Molnet saknar data. Lägg bara upp om vi faktiskt har något att spara –
      // aldrig ett tomt seed (då skulle vi skapa en tom rad i onödan).
      if(!isSeedEmpty())await cloudPut();
    }
    freshBoot=false;
    cloudLastSync=Date.now();cloudSetStatus('ok');cloudStartPolling();
  }catch(e){cloudSetStatus('offline');setTimeout(cloudInit,8000);}
}
function cloudStartPolling(){if(_pollStarted)return;_pollStarted=true;setInterval(async()=>{if(!cloudEnabled()||cloudStatus==='saving')return;if(document.querySelector('.overlay.show'))return;const ae=document.activeElement,tag=ae&&ae.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;try{const ch=await cloudPull(true);if(cloudStatus!=='ok')cloudSetStatus('ok');if(ch)cloudLastSync=Date.now();}catch(e){cloudSetStatus('offline');}},12000);}
async function cloudForcePush(){if(!cloudEnabled()){alert('Molnsynk är inte konfigurerad.');return;}cloudSetStatus('saving');render();try{await cloudPut();cloudLastSync=Date.now();cloudSetStatus('ok');render();toast('✓ Sparat till molnet');}catch(e){cloudSetStatus('offline');render();alert('Kunde INTE spara till molnet:\n'+(cloudLastError||e.message||e)+'\n\nOfta beror det på att tabellen "app_state" saknas eller att RLS blockerar. Klicka "Testa anslutning" och ev. "Visa SQL-schema".');}}
async function cloudForcePull(){if(!cloudEnabled()){alert('Molnsynk är inte konfigurerad.');return;}cloudSetStatus('connecting');render();try{const data=await cloudGet();if(cloudHasData(data)){applyCloud(data);render();toast('✓ Hämtat från molnet');}else{render();alert('Molnet innehåller ingen sparad data ännu (tom rad).\n\nOm du nyss rensade webbläsaren kan molndatan ha skrivits över tidigare. Lägg in dina uppgifter och de synkas nu automatiskt och skyddas mot framtida rensningar.');}cloudLastSync=Date.now();cloudSetStatus('ok');render();}catch(e){cloudSetStatus('offline');render();alert('Kunde INTE hämta från molnet:\n'+(cloudLastError||e.message||e)+'\n\nKlicka "Testa anslutning" för att se orsaken.');}}
async function cloudTest(){
  if(!cloudEnabled()){alert('Molnsynk är inte konfigurerad.');return;}
  toast('Testar anslutning…');cloudSetStatus('connecting');render();
  try{
    const base=supaRestUrl();
    const r=await fetch(`${base}/${CLOUD_TABLE}?key=eq.${encodeURIComponent(CLOUD_KEY)}&select=key`,{headers:cloudHeaders()});
    const body=await r.text();
    if(r.ok){
      let rows=[];try{rows=JSON.parse(body);}catch(e){}
      const has=Array.isArray(rows)&&rows.length;
      cloudSetStatus('ok');render();
      alert(`✓ Anslutning OK (HTTP ${r.status}).\nTabellen "app_state" finns och nyckeln är giltig.\nSparad rad för detta schema: ${has?'JA':'NEJ (ingen data ännu)'}.\n\n${has?'Din data ligger i molnet och hämtas automatiskt på alla enheter.':'Ingen data i molnet ännu – gör en ändring eller klicka "Spara till molnet nu".'}`);
    }else{
      cloudSetStatus('offline');render();
      const missing=/relation|does not exist|42P01|Not Found|PGRST/i.test(body)||r.status===404;
      alert(`⚠ Anslutningen misslyckades: HTTP ${r.status}\n\n${body.slice(0,300)}\n\n${missing?'Sannolik orsak: tabellen "app_state" saknas eller RLS blockerar anon. Klicka "Visa SQL-schema" och kör SQL:en i Supabase → SQL Editor. Sedan fungerar synken.':'Kontrollera Supabase-projektet och att RLS tillåter anon läsning/skrivning.'}`);
    }
  }catch(e){cloudSetStatus('offline');render();alert('Nätverksfel vid test:\n'+(e.message||e)+'\n\nKontrollera internetanslutningen och att Supabase-projektet är aktivt (inte pausat).');}
}
function cloudSetStatus(s){cloudStatus=s;connState=(s==='ok'?'on':s==='offline'?'err':'local');renderConn();}
function cloudStatusText(){const map={off:'Molnsynk av',connecting:'Ansluter till molnet…',ok:'✓ Ansluten – synkas automatiskt',saving:'Sparar till molnet…',offline:'⚠ Offline – lokal lagring (försöker igen)'};return (map[cloudStatus]||'')+(cloudLastSync?` · senast ${new Date(cloudLastSync).toLocaleTimeString('sv-SE')}`:'')+(cloudLastError?` · ${cloudLastError}`:'');}
const SQL_SCHEMA=`-- Gymnasieschema – Supabase
create table if not exists app_state (
  key text primary key,
  data jsonb,
  updated_at timestamptz default now()
);
alter table app_state enable row level security;
create policy "anon all app_state" on app_state for all using (true) with check (true);`;
function showSchema(){$('#importOverlay').querySelector('h2').textContent='Supabase SQL-schema';const b=$('#importBody');b.innerHTML='';b.append(el('p',{class:'muted',style:'margin-top:0'},'Detta schema körs i Supabase SQL Editor. Rekommenderat: ersätt policyn med striktare RLS.'),el('div',{class:'code'},SQL_SCHEMA));const f=$('#importFooter');f.innerHTML='';f.append(el('button',{class:'btn subtle',onclick:()=>{navigator.clipboard.writeText(SQL_SCHEMA).then(()=>toast('SQL kopierad'));}},'Kopiera SQL'),el('button',{class:'btn',onclick:closeImport},'Stäng'));$('#importOverlay').classList.add('show');}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

/* ---------- ingen inloggning längre (borttagen) ---------- */
function refreshLockIfOpen(){}
function startCloudOnce(){if(_cloudStarted)return;_cloudStarted=true;cloudInit();if(state.subscriptions&&state.subscriptions.length)setTimeout(()=>refreshAllSubscriptions(true).then(()=>{if(ui.tab==='schedule'||ui.tab==='list')render();}),1500);startFeedAutoRefresh();}

/* ============================================================ BOOT ============================================================ */
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{ui.tab=b.dataset.tab;saveUI();render();}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEditor();closePerson();closeImport();}});
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('mousedown',e=>{if(e.target===o)o.classList.remove('show');}));
$('#viewOnlyBtn').addEventListener('click',toggleViewOnly);
bindSchedResize();

load();applyTheme();updateViewOnlyBtn();_booted=true;
render();
startCloudOnce();              // molnsynk startar direkt (ingen inloggning)

window.openEditor=openEditor;window.closeEditor=closeEditor;window.saveFromEditor=saveFromEditor;window.deleteFromEditor=deleteFromEditor;
window.openPerson=openPerson;window.closePerson=closePerson;window.savePerson=savePerson;window.deletePerson=deletePerson;
window.openImport=openImport;window.closeImport=closeImport;window.openImageImport=openImageImport;
})();
